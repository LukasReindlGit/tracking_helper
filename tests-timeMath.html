<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>timeMath sanity checks</title>
</head>
<body>
  <p>Open the console (F12). Assertions run on load. Serve this folder over HTTP so the module loads.</p>
  <script type="module">
    import * as tm from "./js/timeMath.js";

    function check(name, cond) {
      if (!cond) console.error("FAIL:", name);
      else console.log("ok:", name);
      console.assert(cond, name);
    }

    check("secondsToDecimalHours 1h", tm.secondsToDecimalHours(3600) === 1);
    check(
      "secondsToDecimalHours 5.3h",
      tm.secondsToDecimalHours(5.3 * 3600) === 5.3
    );

    const seg = [{ topicId: "a", startMs: 0, endMs: 3600000 }];
    const t = tm.totalsPerTopic(seg, null, null, 0);
    check("totalsPerTopic segment", t.a === 3600);

    const t2 = tm.totalsPerTopic([], "x", 1000000, 1000000 + 7200000);
    check("totalsPerTopic active", Math.abs(t2.x - 7200) < 1e-6);

    check(
      "remainderHoursToEight",
      tm.remainderHoursToEight({ a: 5 * 3600 }) === 3
    );

    const scaled = tm.scaledToEightHours({
      a: 3 * 3600,
      b: 2 * 3600,
    });
    const byId = Object.fromEntries(scaled.map((r) => [r.topicId, r.scaledHours]));
    check(
      "scaledToEightHours 3h+2h reconciles to 8h (quarter)",
      byId.a === 4.75 && byId.b === 3.25 &&
        Math.abs(byId.a + byId.b - 8) < 1e-6
    );

    const scaledNone = tm.scaledToTargetHours(
      { a: 3 * 3600, b: 2 * 3600 },
      8,
      "none"
    );
    const byNone = Object.fromEntries(
      scaledNone.map((r) => [r.topicId, r.scaledHours])
    );
    check(
      "scaledToTargetHours 8h none",
      byNone.a === 4.8 && byNone.b === 3.2
    );

    const scaled6 = tm.scaledToTargetHours(
      { a: 3 * 3600, b: 2 * 3600 },
      6,
      "none"
    );
    const byId6 = Object.fromEntries(
      scaled6.map((r) => [r.topicId, r.scaledHours])
    );
    check(
      "scaledToTargetHours 6h total",
      byId6.a === 3.6 && byId6.b === 2.4
    );

    const scaledQ = tm.scaledToTargetHours(
      { a: 3 * 3600, b: 2 * 3600 },
      8,
      "quarter"
    );
    const byQ = Object.fromEntries(
      scaledQ.map((r) => [r.topicId, r.scaledHours])
    );
    check(
      "scaledToTargetHours quarter 3h+2h to 8h (sum matches target)",
      byQ.a === 4.75 && byQ.b === 3.25 &&
        Math.abs(byQ.a + byQ.b - 8) < 1e-6
    );

    const scaledH = tm.scaledToTargetHours(
      { a: 3 * 3600, b: 2 * 3600 },
      8,
      "half"
    );
    const byH = Object.fromEntries(
      scaledH.map((r) => [r.topicId, r.scaledHours])
    );
    check(
      "scaledToTargetHours half 3h+2h reconciles to 8h",
      byH.a === 5 && byH.b === 3 &&
        Math.abs(byH.a + byH.b - 8) < 1e-6
    );

    const scaled1 = tm.scaledToTargetHours(
      { a: 3 * 3600, b: 2 * 3600 },
      8,
      "hour"
    );
    const by1 = Object.fromEntries(
      scaled1.map((r) => [r.topicId, r.scaledHours])
    );
    check(
      "scaledToTargetHours hour 3h+2h reconciles to 8h",
      by1.a === 5 && by1.b === 3 &&
        Math.abs(by1.a + by1.b - 8) < 1e-6
    );

    const scaled5m = tm.scaledToTargetHours(
      { a: 3 * 3600, b: 2 * 3600 },
      8,
      "quarter",
      5
    );
    const by5m = Object.fromEntries(
      scaled5m.map((r) => [r.topicId, r.scaledHours])
    );
    check(
      "scaledToTargetHours quarter + 5min rule 3h+2h to 8h",
      by5m.a === 4.75 && by5m.b === 3.25 &&
        Math.abs(by5m.a + by5m.b - 8) < 1e-6
    );

    const scaledEdge = tm.scaledToTargetHours(
      { a: 3690, b: 5910 },
      8,
      "quarter",
      5
    );
    const byE = Object.fromEntries(
      scaledEdge.map((r) => [r.topicId, r.scaledHours])
    );
    check(
      "5min rule: remainder under 5 min rounds down (avoids float edge at exactly 5 min)",
      byE.a === 3 && byE.b === 5
    );

    const fixedMap = new Map([["a", false]]);
    const mixedScaled = tm.scaledToTargetHours(
      { a: 3600, b: 2 * 3600, c: 2 * 3600 },
      8,
      "none",
      0,
      fixedMap
    );
    const byMix = Object.fromEntries(
      mixedScaled.map((r) => [r.topicId, r.scaledHours])
    );
    check(
      "scaledToTargetHours fixed 1h + scalable 2h+2h to 8h (none)",
      byMix.a === 1 && byMix.b === 3.5 && byMix.c === 3.5
    );

    const allFixed = tm.scaledToTargetHours(
      { a: 3600, b: 3600 },
      8,
      "quarter",
      0,
      new Map([
        ["a", false],
        ["b", false],
      ])
    );
    const byAllF = Object.fromEntries(
      allFixed.map((r) => [r.topicId, r.scaledHours])
    );
    check(
      "scaledToTargetHours all fixed: actual hours, no stretch",
      byAllF.a === 1 && byAllF.b === 1
    );

    const fixedQuarter = tm.scaledToTargetHours(
      { a: 3900 },
      8,
      "quarter",
      0,
      new Map([["a", false]])
    );
    const byFq = Object.fromEntries(
      fixedQuarter.map((r) => [r.topicId, r.scaledHours])
    );
    check(
      "non-scalable row: rounded to step (1:05 → 1.25 h quarter), not one-decimal only",
      byFq.a === 1.25
    );

    const effOver = tm.effectiveScaledRows(
      { a: 5 * 3600, b: 4 * 3600 },
      8,
      "quarter",
      0,
      null
    );
    const byOver = Object.fromEntries(
      effOver.rows.map((r) => [r.topicId, r.scaledHours])
    );
    check(
      "effectiveScaledRows over target: actual hours, no scale-down",
      effOver.mode === "actual" &&
        byOver.a === 5 &&
        byOver.b === 4 &&
        effOver.totalRecordedHours === 9
    );

    const effUnder = tm.effectiveScaledRows(
      { a: 3 * 3600, b: 2 * 3600 },
      8,
      "none"
    );
    const byUnder = Object.fromEntries(
      effUnder.rows.map((r) => [r.topicId, r.scaledHours])
    );
    check(
      "effectiveScaledRows under target matches scaledToTargetHours",
      effUnder.mode === "scaled" &&
        byUnder.a === 4.8 &&
        byUnder.b === 3.2
    );

    const fixedMap2 = new Map([
      ["a", false],
      ["b", false],
    ]);
    const effMixOver = tm.effectiveScaledRows(
      { a: 5 * 3600, b: 4 * 3600 },
      8,
      "quarter",
      0,
      fixedMap2
    );
    const byMixOver = Object.fromEntries(
      effMixOver.rows.map((r) => [r.topicId, r.scaledHours])
    );
    check(
      "effectiveScaledRows over target mixed fixed/scalable: all actual",
      effMixOver.mode === "actual" &&
        byMixOver.a === 5 &&
        byMixOver.b === 4
    );

    check(
      "totalRecordedDecimalHours",
      tm.totalRecordedDecimalHours({ a: 3 * 3600, b: 2 * 3600 }) === 5
    );

    const sec401 = Math.round(4.01 * 3600);
    const effDisplay8 = tm.effectiveScaledRows(
      { a: sec401, b: sec401 },
      8,
      "quarter",
      0,
      null
    );
    const by401 = Object.fromEntries(
      effDisplay8.rows.map((r) => [r.topicId, r.scaledHours])
    );
    check(
      "effectiveScaledRows raw>target but displayed sum at target: still scaled + rounding",
      effDisplay8.mode === "scaled" &&
        by401.a === 4 &&
        by401.b === 4
    );

    const h7 = 4.75 + 7 / 60;
    check(
      "past-step 7 min remainder: 5 min threshold rounds up",
      tm.applyScaledHoursRounding(h7, "quarter", 5) === 5
    );
    check(
      "past-step 7 min remainder: 10 min threshold rounds down",
      tm.applyScaledHoursRounding(h7, "quarter", 10) === 4.75
    );

    // Scale-up to 8h with hour steps + 5 min past-step threshold (UI “Round up only if more than 5 min…”).
    // Raw tracking 03:03:00 + 04:05:00 + 00:53:00 → proportional hours then round: 3h, 4h, 1h
    // (3 and 4 min past the lower hour round down; 53 min past 0 rounds up to 1h).
    const sec303 = tm.parseTimeInputToSeconds("3:03:00");
    const sec405 = tm.parseTimeInputToSeconds("4:05:00");
    const sec053 = tm.parseTimeInputToSeconds("0:53:00");
    const totalSecExample = sec303 + sec405 + sec053;
    const rawA = (sec303 / totalSecExample) * 8;
    const rawB = (sec405 / totalSecExample) * 8;
    const rawC = (sec053 / totalSecExample) * 8;
    check(
      "applyScaledHoursRounding hour+5min: 03:03-style proportional → 3h",
      tm.applyScaledHoursRounding(rawA, "hour", 5) === 3
    );
    check(
      "applyScaledHoursRounding hour+5min: 04:05-style proportional → 4h",
      tm.applyScaledHoursRounding(rawB, "hour", 5) === 4
    );
    check(
      "applyScaledHoursRounding hour+5min: 00:53-style proportional → 1h",
      tm.applyScaledHoursRounding(rawC, "hour", 5) === 1
    );

    const scaledHour5 = tm.scaledToTargetHours(
      { a: sec303, b: sec405, c: sec053 },
      8,
      "hour",
      5
    );
    const byHour5 = Object.fromEntries(
      scaledHour5.map((r) => [r.topicId, r.scaledHours])
    );
    check(
      "scaledToTargetHours 8h hour+5min: 03:03 + 04:05 + 00:53 → 3h, 4h, 1h (sum 8h)",
      byHour5.a === 3 &&
        byHour5.b === 4 &&
        byHour5.c === 1 &&
        Math.abs(byHour5.a + byHour5.b + byHour5.c - 8) < 1e-6
    );
    check(
      "scaled hours as h:mm:ss match 03:00:00, 04:00:00, 01:00:00",
      tm.formatSecondsAsHhMmSs(byHour5.a * 3600) === "3:00:00" &&
        tm.formatSecondsAsHhMmSs(byHour5.b * 3600) === "4:00:00" &&
        tm.formatSecondsAsHhMmSs(byHour5.c * 3600) === "1:00:00"
    );

    check(
      "formatSecondsAsHhMmSs zero",
      tm.formatSecondsAsHhMmSs(0) === "0:00:00"
    );
    check(
      "formatSecondsAsHhMmSs 1h",
      tm.formatSecondsAsHhMmSs(3600) === "1:00:00"
    );
    check(
      "formatSecondsAsHhMmSs 90m",
      tm.formatSecondsAsHhMmSs(90 * 60) === "1:30:00"
    );
    check(
      "formatSecondsAsHhMmSs floors subsecond",
      tm.formatSecondsAsHhMmSs(5.9) === "0:00:05"
    );

    check(
      "parseTimeInputToSeconds decimal",
      Math.abs(tm.parseTimeInputToSeconds("5.3") - 5.3 * 3600) < 1e-6
    );
    check(
      "parseTimeInputToSeconds decimal comma",
      Math.abs(tm.parseTimeInputToSeconds("5,3") - 5.3 * 3600) < 1e-6
    );
    check(
      "formatDecimalHours uses comma",
      tm.formatDecimalHours(5.3 * 3600) === "5,3"
    );
    check(
      "parseTimeInputToSeconds h:mm:ss",
      tm.parseTimeInputToSeconds("1:05:30") === 3600 + 5 * 60 + 30
    );
    check(
      "parseTimeInputToSeconds mm:ss",
      tm.parseTimeInputToSeconds("5:30") === 5 * 60 + 30
    );

    console.log("timeMath checks finished.");
  </script>
</body>
</html>
